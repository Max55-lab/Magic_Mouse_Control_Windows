[package]
name = "magic-mouse-control"
version = "0.1.0"
edition = "2021"
authors = ["Magic Mouse Control contributors"]
description = "Free, open-source Magic Mouse driver and settings app for Windows"
license = "MIT"
repository = "https://github.com/example/magic-mouse-control"
readme = "README.md"

[dependencies]
hidapi = "2.6"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_UI_WindowsAndMessaging",
] }
tray-icon = "0.19"
winit = "0.30"
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tauri-winrt-notification = "0.7"

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = 3
