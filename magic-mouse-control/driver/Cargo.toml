[package]
name = "mmk"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Magic Mouse 2 kernel tap (KMDF lower filter) - experimental"
publish = false

# Standalone workspace: keeps the user-mode app's `cargo build --release`
# from ever trying to compile kernel code (which needs the WDK).
[workspace]

[lib]
crate-type = ["cdylib"]

[package.metadata.wdk.driver-model]
driver-type = "KMDF"
kmdf-version-major = 1
target-kmdf-version-minor = 33

[features]
default = []
# Phase 3: compile-check the VHF virtual precision touchpad skeleton. The real
# `mmk-vhid` function driver is a separate package; never ship `mmk.sys` built
# with this feature, because the observation filter must not link VHF.
vhf = ["wdk-sys/hid"]

[dependencies]
wdk = "0.5.0"
wdk-sys = "0.5.2"
wdk-panic = "0.5.0"

[build-dependencies]
wdk-build = "0.6.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
